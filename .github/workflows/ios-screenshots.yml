name: iOS App Store Screenshots

# Scripted, non-interactive screenshot capture: for each target route, builds
# the app with that route baked in as the initial hash (set synchronously,
# before the app's router initializes - no timing races), boots a simulator,
# installs, launches, and screenshots after a fixed settle time.

on:
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        route:
          - { path: "", name: "groups" }
          - { path: "/groups/13/balances", name: "balances" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Inject demo auth session + initial route
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_AUTH_TOKEN }}
          DEMO_USER: ${{ secrets.DEMO_AUTH_USER }}
          ROUTE_PATH: ${{ matrix.route.path }}
        run: |
          python3 -c "
          import json, os

          token = os.environ['DEMO_TOKEN']
          user = os.environ['DEMO_USER']
          route = os.environ['ROUTE_PATH']

          inject = '''<script>
          (function() {
            try {
              var token = ''' + json.dumps(token) + ''';
              var user = ''' + json.dumps(user) + ''';
              localStorage.setItem('bs_auth_token', token);
              localStorage.setItem('bs_auth_user', user);
              sessionStorage.setItem('bs_auth_token', token);
              sessionStorage.setItem('bs_auth_user', user);
            } catch(e) {}
            // Set the initial route synchronously, before the router mounts -
            // no setTimeout race with app boot time.
            window.location.hash = ''' + json.dumps(route) + ''';
          })();
          </script>'''

          with open('dist/public/index.html') as f:
              html = f.read()
          html = html.replace('</head>', inject + '</head>')
          with open('dist/public/index.html', 'w') as f:
              f.write(html)
          "
          grep -c "bs_auth_token" dist/public/index.html

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath $RUNNER_TEMP/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Find built .app
        run: |
          find $RUNNER_TEMP/build -name "App.app" -path "*iphonesimulator*"
          echo "APP_PATH=$(find $RUNNER_TEMP/build -name 'App.app' -path '*iphonesimulator*' | head -1)" >> $GITHUB_ENV

      - name: Capture screenshots
        env:
          ROUTE_NAME: ${{ matrix.route.name }}
        run: |
          mkdir -p $RUNNER_TEMP/screenshots
          BUNDLE_ID="com.pickletab.ios"

          capture_for_device() {
            local device_name="$1"
            local out_prefix="$2"
            echo "=== $device_name ($ROUTE_NAME) ==="

            local udid=$(xcrun simctl create "shot-$out_prefix-$ROUTE_NAME" "$device_name" 2>&1 | tail -1)
            echo "udid: $udid"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b

            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl launch "$udid" "$BUNDLE_ID"

            sleep 10
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/screenshots/${out_prefix}_${ROUTE_NAME}.png"

            xcrun simctl shutdown "$udid"
            xcrun simctl delete "$udid"
          }

          capture_for_device "iPhone 17 Pro Max" "iphone69"
          capture_for_device "iPad Pro 13-inch (M4)" "ipad13"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickletab-ios-screenshots-${{ matrix.route.name }}
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
