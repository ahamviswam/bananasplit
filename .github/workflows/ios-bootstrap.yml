name: iOS Platform Bootstrap

# One-time job: scaffolds the Capacitor iOS platform (ios/) on a macOS runner,
# since CocoaPods can't be installed locally on the dev machine, then commits
# the generated project back to main. Safe to re-run — it no-ops if ios/App
# already exists.
#
# retry: capacitor/cli was mismatched against core/android/ios (v7 vs v8),
# which produced an Xcode project with too low a deployment target for the
# v8 Capacitor pod. Fixed by aligning all @capacitor/* packages to 8.5.2.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check if iOS platform already exists
        id: check
        run: |
          if [ -d "ios/App" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build web assets
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Add iOS platform
        if: steps.check.outputs.exists == 'false'
        run: npx cap add ios

      - name: Sync iOS platform
        if: steps.check.outputs.exists == 'false'
        run: npx cap sync ios

      - name: Commit and push ios/ project
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          git commit -m "Add iOS Capacitor platform (auto-generated)"
          git push
